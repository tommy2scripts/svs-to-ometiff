[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svs-to-ometiff"
version = "1.0.0"
description = "Convert Aperio SVS (compression 33007 / YUYV) to pyramidal OME-TIFF"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Tommy Tran and contributors"}
]
keywords = ["aperio", "svs", "ometiff", "whole-slide-imaging", "pathology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "tifffile>=2022.5.4",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
svs-to-ometiff = "svs_to_ometiff.cli:main"

[project.urls]
Homepage = "https://github.com/tommytran/svs-to-ometiff"

[tool.ruff]
line-length = 88

[tool.hatch.build.targets.wheel]
packages = ["src/svs_to_ometiff"]
