version: "3.8"

services:
  svs-to-ometiff:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      # Mount only the slide directory you want this local GUI to access.
      - ./data:/data
    environment:
      - SVS_GUI_HOST=0.0.0.0
      - SVS_GUI_PORT=5000
      - SVS_GUI_MAX_JOBS=1
    restart: unless-stopped
